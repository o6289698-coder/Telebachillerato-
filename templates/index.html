<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telebachillerato Comunitario San Javier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid #2e7d32;
        }
        h1 {
            color: #2e7d32;
            font-size: 24px;
            text-align: center;
        }
        p {
            color: #555;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .respuesta-box {
            margin-top: 20px;
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #2e7d32;
        }
        .respuesta-box h3 {
            margin-top: 0;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 Asesor Escolar JavI.A.</h1>
        <p>¿Tienes dudas con una tarea, una fórmula o un resumen? Pregúntale directo a JavI.A.</p>

        <!-- El formulario envía los datos a la misma ruta mediante POST -->
        <form method="POST">
            <textarea name="pregunta" placeholder="Escribe tu duda aquí..." required></textarea>
            <button type="submit">Preguntar a JavI.A.</button>
        </form>

        <!-- Bloque que se muestra únicamente cuando la IA responde -->
        {% if respuesta_ia %}
            <div class="respuesta-box">
                <h3>Respuesta de JavI.A.:</h3>
                <p>{{ respuesta_ia }}</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
